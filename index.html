<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Timer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-100 to-purple-100 min-h-screen flex flex-col justify-between px-4 py-8">

  <!-- Main Container -->
  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-4xl mx-auto space-y-6">
    <h1 class="text-4xl font-bold text-center text-blue-700">⏱️ Number Timer</h1>
    <p class="text-center text-gray-500">Paste numbers below and generate future time based on your selection</p>

    <textarea id="numberInput" placeholder="Paste numbers here (one per line)..." class="w-full p-4 border border-blue-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none h-40"></textarea>
    
    <button onclick="generateNumbers()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-200">
      Submit Numbers
    </button>

    <div id="numberList" class="space-y-4"></div>
  </div>

  <!-- Footer -->
  <footer class="w-full text-center text-sm text-gray-500 py-4 mt-12">
    Made with ❤️ by <span class="font-semibold text-blue-600">TalHa RaHman</span> |
    <a href="https://t.me/talha_rahman" target="_blank" class="text-blue-500 hover:underline">@talha_rahman</a>
  </footer>

  <!-- Script -->
  <script>
    async function sendToBackend(number, time, duration) {
      try {
        const res = await fetch('https://your-backend-api.com/save-time', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ number, time, duration })
        });
        const data = await res.json();
        console.log('Saved to backend:', data);
      } catch (err) {
        console.error('Backend error:', err);
      }
    }

    function generateNumbers() {
      const input = document.getElementById("numberInput").value.trim();
      const lines = input.split("\n");
      const container = document.getElementById("numberList");
      container.innerHTML = "";

      lines.forEach(number => {
        if (!number.trim()) return;

        const row = document.createElement("div");
        row.className = "flex items-center justify-between bg-white p-4 border border-blue-100 rounded-xl shadow-sm";

        const numberText = document.createElement("div");
        numberText.textContent = number;
        numberText.className = "font-medium text-gray-700 w-1/3";

        const buttons = document.createElement("div");
        buttons.className = "flex gap-2 justify-center w-1/3";

        const outputSpan = document.createElement("div");
        outputSpan.className = "text-green-600 font-semibold w-1/3 text-right";

        [5, 10, 30].forEach(min => {
          const btn = document.createElement("button");
          btn.textContent = `${min} min`;
          btn.className = "bg-blue-100 hover:bg-blue-200 text-blue-800 font-medium px-3 py-1 rounded-full text-sm transition";
          btn.onclick = () => {
            const now = new Date();
            now.setMinutes(now.getMinutes() + min);
            const futureTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            outputSpan.textContent = `→ ${futureTime}`;
            sendToBackend(number, futureTime, min);
          };
          buttons.appendChild(btn);
        });

        row.appendChild(numberText);
        row.appendChild(buttons);
        row.appendChild(outputSpan);

        container.appendChild(row);
      });
    }
  </script>
</body>
</html>
